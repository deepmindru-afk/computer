[project]
name = "cptr"
version = "0.9.21"
description = "Your computer, from anywhere. Code, manage, and control your machine from the web."
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.2",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "watchdog>=6.0.0",
    "bcrypt>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "PyJWT>=2.13.0",
    "cryptography>=48.0.1,<49.0.0",
    "loguru>=0.7.3",
    "python-socketio[asgi]>=5.16.4",
    "python-dateutil>=2.9.0",
    "truststore>=0.10.4",
    "pywinpty>=3.0.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
pam = ["python-pam>=2.0.2"]
mcp = ["mcp>=1.29.0,<2"]
docs = ["pypdf>=6.16.1", "python-docx>=1.2.0", "openpyxl>=3.1.5"]
agents = ["claude-agent-sdk>=0.2.140"]
all = [
    "mcp>=1.29.0,<2",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pam>=2.0.2",
    "claude-agent-sdk>=0.2.140",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[project.scripts]
cptr = "cptr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["cptr"]
exclude = ["cptr/frontend"]

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "cptr/CHANGELOG.md"
"cptr/frontend/build" = "cptr/frontend/build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "cptr/frontend",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
